name: インスタ自動投稿

on:
  schedule:
    # 30分ごとに起動し、schedule.json の投稿時刻を過ぎていれば投稿（GitHubの都合で数分〜数十分遅れることがある）
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "今すぐ1枚投稿する（予定時刻に関係なく）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: git設定
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
      - name: 投稿
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: node post.js
