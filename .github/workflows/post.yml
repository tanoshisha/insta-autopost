name: インスタ自動投稿

# GitHub の定期起動は混んでいると数時間おきにしか動かない。
# そこで、1回起動したら約5時間45分起きたままにして、1分ごとに予定時刻を確認して投稿する。
# 次の起動は前のが終わるまで待機し（同時には動かない）、終わったらすぐ続きを引き継ぐ。
on:
  # アプリやPCで予約を変えた時（push）にも起動 → 止まっていても自動で見張りが再開する
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "今すぐ1枚投稿する（予定時刻に関係なく）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 画像処理の部品（ストーリーの残り人数用）
        run: npm ci --omit=dev --no-audit --no-fund
        continue-on-error: true # 失敗しても投稿は止めない（残り人数なしで投稿）
      - name: 日本語フォント（リールのタイトル用）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
        continue-on-error: true
      - name: git設定
        run: |
          git config user.name "insta-bot"
          git config user.email "insta-bot@users.noreply.github.com"
      - name: 投稿（1分ごとに予定時刻を確認）
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          # 「今すぐ1枚」で起動した時は、まず1枚投稿してから見張りを続ける
          if [ "$FORCE" = "1" ]; then node post.js || true; fi
          export FORCE=
          end=$((SECONDS + 20700))
          while [ $SECONDS -lt $end ]; do
            # アプリやPCでの変更（並べ替え・ペースなど）を毎回取り込んでから確認
            git fetch -q origin main && git reset -q --hard origin/main
            node post.js || echo "（この回はエラー。1分後にもう一度確認します）"
            sleep 60
          done
